openapi: 3.1.0
info:
  title: Trekky API
  version: 0.1.0-draft
  summary: Draft contract for v0.1 to v1.0 (TRK-5). The implemented spec is generated by the API at /openapi/v1.json and must match this draft or update it in the same TRK.
  description: |
    Conventions
    - All endpoints are under `/api/v1` and need a bearer access token unless marked otherwise.
    - IDs are UUIDv7 (ADR-0005). Work items also have human keys like `TRK-42`.
    - Errors are RFC 9457 problem details (`application/problem+json`).
    - Lists use cursor pagination: `?limit=` (1–100, default 50) and `?cursor=` from the previous page's `nextCursor`.
    - Single resources return an `ETag`; updates require `If-Match` (412 if stale, 428 if missing).
    - A resource in another organization returns 404, never 403.

    OAuth endpoints (served by OpenIddict, not described here): `GET /connect/authorize` (authorization code + PKCE),
    `POST /connect/token` (code exchange, refresh with rotation), `POST /connect/revoke`, `GET /.well-known/openid-configuration`, JWKS. See ADR-0003.
servers:
  - url: http://localhost:5080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Members
  - name: Projects
  - name: WorkItems
  - name: Comments

paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /api/v1/auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Create a user, an organization and an Owner membership (US-01)
      description: Runs in one transaction. On success sets the HttpOnly session cookie used by `/connect/authorize`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201':
          description: Account and organization created; session cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '409':
          description: An account with this email already exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: logIn
      summary: Check credentials and set the session cookie (US-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204': { description: Logged in; session cookie set. }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401':
          description: Email or password is incorrect (one generic message).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '423':
          description: Account locked after repeated failures.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logOut
      summary: End the session and revoke the caller's refresh tokens
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The current user, organization and role
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: Members of the caller's organization (assignee picker, US-13)
      responses:
        '200':
          description: Members, ordered by display name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects (US-05)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of projects ordered by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project (US-05)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Project created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The key is already used in this organization.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      responses:
        '200':
          description: The project.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectId}/work-items:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [WorkItems]
      operationId: listWorkItems
      summary: List a project's work items, newest update first (US-08)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of work items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [WorkItems]
      operationId: createWorkItem
      summary: Create a work item (US-06)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkItemRequest' }
      responses:
        '201':
          description: Work item created in To Do with the next key.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ParentRuleViolation' }

  /api/v1/projects/{projectId}/board:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [WorkItems]
      operationId: getBoard
      summary: Board columns with cards ordered by rank (US-11, v1.0)
      responses:
        '200':
          description: One column per status in workflow order. Done holds the latest 20 cards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Board' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/work-items/{workItemId}:
    parameters:
      - $ref: '#/components/parameters/WorkItemId'
    get:
      tags: [WorkItems]
      operationId: getWorkItem
      summary: Get a work item with parent and children (US-09)
      responses:
        '200':
          description: The work item.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [WorkItems]
      operationId: updateWorkItem
      summary: Edit title, description, type, parent or assignee (US-07, US-13)
      description: JSON merge patch; only the fields sent change. Status changes use `/status`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateWorkItemRequest' }
      responses:
        '200':
          description: Updated work item.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ParentRuleViolation' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/v1/work-items/by-key/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: Work item key, e.g. `TRK-42`.
        schema: { type: string, pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$' }
    get:
      tags: [WorkItems]
      operationId: getWorkItemByKey
      summary: Get a work item by its key (US-09 URLs, "go to item")
      responses:
        '200':
          description: The work item.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/work-items/{workItemId}/status:
    parameters:
      - $ref: '#/components/parameters/WorkItemId'
    post:
      tags: [WorkItems]
      operationId: changeWorkItemStatus
      summary: Move an item through the workflow (US-10)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: '#/components/schemas/WorkItemStatus' }
      responses:
        '200':
          description: Status changed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transition not allowed; `allowedTransitions` lists the valid targets.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/TransitionProblem' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/v1/work-items/{workItemId}/move:
    parameters:
      - $ref: '#/components/parameters/WorkItemId'
    post:
      tags: [WorkItems]
      operationId: moveWorkItemOnBoard
      summary: Drop a card on the board — optional status change plus new position (US-11, v1.0)
      description: Position is given by neighbours in the target column; the server computes the rank. A status change follows the same rules as `/status`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/WorkItemStatus' }
                afterId: { type: [string, 'null'], format: uuid, description: Card directly above; null for the top. }
                beforeId: { type: [string, 'null'], format: uuid, description: Card directly below; null for the bottom. }
      responses:
        '200':
          description: Moved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transition not allowed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/TransitionProblem' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/v1/work-items/{workItemId}/history:
    parameters:
      - $ref: '#/components/parameters/WorkItemId'
    get:
      tags: [WorkItems]
      operationId: getWorkItemHistory
      summary: Activity events for an item, newest first (US-09)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/work-items/{workItemId}/comments:
    parameters:
      - $ref: '#/components/parameters/WorkItemId'
    get:
      tags: [Comments]
      operationId: listComments
      summary: Comments on an item, oldest first (US-12, v1.0)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of comments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      operationId: addComment
      summary: Add a comment (US-12, v1.0)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentBody' }
      responses:
        '201':
          description: Comment added.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Comments]
      operationId: editComment
      summary: Edit your own comment (US-12, v1.0)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/CommentBody' }
      responses:
        '200':
          description: Comment updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Only the author can edit a comment.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Delete your own comment (soft delete, US-12, v1.0)
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Only the author can delete a comment.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/connect/token` (15 minutes). Claims include `sub`, `org_id`, `role`.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque value from the previous page's `nextCursor`.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` from the last read of this resource.
      schema: { type: string }

  headers:
    ETag:
      description: Version of the resource; send it back in `If-Match` to update.
      schema: { type: string }
    Location:
      description: URL of the created resource.
      schema: { type: string, format: uri-reference }

  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or belongs to another organization.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationProblem:
      description: The request is invalid; `errors` maps field names to messages.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    ParentRuleViolation:
      description: The parent is not allowed for this item type; `allowedParentTypes` lists the valid ones.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ParentRuleProblem' }
    PreconditionFailed:
      description: The resource changed since it was read (stale `If-Match`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: '`If-Match` header is required.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    TransitionProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [allowedTransitions]
          properties:
            allowedTransitions:
              type: array
              items: { $ref: '#/components/schemas/WorkItemStatus' }
    ParentRuleProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [allowedParentTypes]
          properties:
            allowedParentTypes:
              type: array
              items: { $ref: '#/components/schemas/WorkItemType' }

    SignUpRequest:
      type: object
      required: [email, password, organizationName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        organizationName: { type: string, minLength: 1, maxLength: 80 }
        displayName: { type: string, maxLength: 80, description: Defaults to the part of the email before @. }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    Me:
      type: object
      required: [user, organization, role]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        organization:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Role:
      type: string
      enum: [owner, admin, member, viewer]
    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
    Member:
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/Role' }

    CreateProjectRequest:
      type: object
      required: [name, key]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        key: { type: string, pattern: '^[A-Z][A-Z0-9]{1,9}$' }
    Project:
      type: object
      required: [id, key, name, itemCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        itemCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ProjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        nextCursor: { type: [string, 'null'] }

    WorkItemType:
      type: string
      enum: [epic, story, task, subtask, bug, tech_debt]
    WorkItemStatus:
      type: string
      enum: [todo, in_progress, in_review, done]
    CreateWorkItemRequest:
      type: object
      required: [type, title]
      properties:
        type: { $ref: '#/components/schemas/WorkItemType' }
        title: { type: string, minLength: 1, maxLength: 200 }
        descriptionMd: { type: [string, 'null'], maxLength: 50000 }
        parentId: { type: [string, 'null'], format: uuid }
    UpdateWorkItemRequest:
      type: object
      minProperties: 1
      properties:
        type: { $ref: '#/components/schemas/WorkItemType' }
        title: { type: string, minLength: 1, maxLength: 200 }
        descriptionMd: { type: [string, 'null'], maxLength: 50000 }
        parentId: { type: [string, 'null'], format: uuid }
        assigneeId: { type: [string, 'null'], format: uuid, description: v1.0 }
    WorkItemSummary:
      type: object
      required: [id, key, type, title, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, examples: [TRK-42] }
        type: { $ref: '#/components/schemas/WorkItemType' }
        title: { type: string }
        status: { $ref: '#/components/schemas/WorkItemStatus' }
        parentKey: { type: [string, 'null'] }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        updatedAt: { type: string, format: date-time }
    WorkItemDetail:
      allOf:
        - $ref: '#/components/schemas/WorkItemSummary'
        - type: object
          required: [projectId, allowedTransitions, children, createdAt, createdBy]
          properties:
            projectId: { type: string, format: uuid }
            descriptionMd: { type: [string, 'null'] }
            parent:
              oneOf:
                - $ref: '#/components/schemas/WorkItemSummary'
                - type: 'null'
            children:
              type: array
              items: { $ref: '#/components/schemas/WorkItemSummary' }
            allowedTransitions:
              type: array
              description: Statuses this item can move to now; drives the status dropdown.
              items: { $ref: '#/components/schemas/WorkItemStatus' }
            createdAt: { type: string, format: date-time }
            createdBy: { $ref: '#/components/schemas/UserRef' }
    WorkItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkItemSummary' }
        nextCursor: { type: [string, 'null'] }
    Board:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          items:
            type: object
            required: [status, count, items]
            properties:
              status: { $ref: '#/components/schemas/WorkItemStatus' }
              count: { type: integer, minimum: 0 }
              items:
                type: array
                items: { $ref: '#/components/schemas/WorkItemSummary' }

    ActivityEvent:
      type: object
      description: See docs/tech/activity-events.md.
      required: [eventId, eventType, schemaVersion, occurredAt, actor, entity, payload]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, examples: [WorkItemStatusChanged] }
        schemaVersion: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        actor:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [user, agent, system] }
            id: { type: [string, 'null'], format: uuid }
            displayName: { type: [string, 'null'] }
        entity:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [project, work_item, comment] }
            id: { type: string, format: uuid }
            key: { type: [string, 'null'] }
        payload: { type: object }
    ActivityEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        nextCursor: { type: [string, 'null'] }

    CommentBody:
      type: object
      required: [bodyMd]
      properties:
        bodyMd: { type: string, minLength: 1, maxLength: 20000 }
    Comment:
      type: object
      required: [id, workItemId, author, bodyMd, createdAt, edited]
      properties:
        id: { type: string, format: uuid }
        workItemId: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserRef' }
        bodyMd: { type: string }
        createdAt: { type: string, format: date-time }
        edited: { type: boolean }
    CommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        nextCursor: { type: [string, 'null'] }
