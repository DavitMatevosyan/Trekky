[package]
name = "trekky-desktop"
version = "0.1.0"
description = "Trekky for Windows"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[lib]
# A name other than the binary's, so cargo test and the Windows linker do not clash.
name = "trekky_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-updater = "=2.14.1"
keyring-core = "=1.0.1"
windows-native-keyring-store = "=1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
