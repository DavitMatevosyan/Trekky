# Code graph (ADR-0029): builds the graphify knowledge graph from dev and publishes it on the `graphify` branch, which
# sessions restore into graphify-out/ (tools/graphify/fetch-graph.sh). Code only, no model and no API key; the docs layer
# from the last manual docs pass (tools/graphify/docs-layer.json) is merged in. This workflow is the only writer of that
# branch: one orphan commit, replaced on every build, so the branch never grows.
#
# Two jobs so the write token never meets third-party code: `build` installs graphify and its dependencies with a
# read-only token; `publish` runs no checkout and no installed tool, only git, with the write token.
name: Code graph

on:
  push:
    branches: [dev]
  # A PR that changes how the graph is built checks the build (never publishes).
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/graphify.yml
      - .graphifyignore
      - tools/graphify/**
  workflow_dispatch:

permissions:
  contents: read

# Only the newest graph of a ref matters: a newer push to dev cancels an older dev build.
concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

env:
  GRAPHIFY_VERSION: 0.9.113

jobs:
  build:
    name: Build the code graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the docs layer merge
        run: python3 -m unittest discover -s tools/graphify -p "test_*.py" -v

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install graphify
        run: uv tool install "graphifyy[sql]==${GRAPHIFY_VERSION}"

      - name: Build the graph from code
        run: |
          graphify extract . --code-only
          python3 tools/graphify/docs_layer.py merge
          graphify cluster-only . --no-label
          for f in graph.json GRAPH_REPORT.md graph.html manifest.json; do
            test -s "graphify-out/$f" || { echo "::error::graphify-out/$f is missing or empty"; exit 1; }
          done

      - name: Describe the build
        env:
          DEV_SHA: ${{ github.sha }}
        run: |
          printf '{"dev_commit": "%s", "graphify_version": "%s", "built_at": "%s", "run": "%s"}\n' \
            "$DEV_SHA" "$GRAPHIFY_VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > graphify-out/source.json

      - uses: actions/upload-artifact@v7
        # Only a dev build is published; a PR run checks the build alone.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        with:
          name: code-graph
          retention-days: 1
          if-no-files-found: error
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.html
            graphify-out/manifest.json
            graphify-out/source.json

  publish:
    name: Publish to the graphify branch
    needs: build
    # Only a dev build is published; a PR or a manual run on another branch would not match dev.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: code-graph
          path: ${{ runner.temp }}/publish/graphify-out

      - name: Replace the branch with one commit
        env:
          DEV_SHA: ${{ github.sha }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/publish"
          printf '# graphify\n\nThe code graph of dev %s, built by .github/workflows/graphify.yml (ADR-0029). Do not commit here: every build replaces this branch with one new commit.\n' "$DEV_SHA" > README.md
          git init --quiet --initial-branch=graphify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Code graph of dev ${DEV_SHA::7}"
          # The one force-update in the repo (ADR-0029): this branch only, from this job only.
          git push --quiet --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" graphify:graphify
          echo "Published the graph of dev ${DEV_SHA::7} to the graphify branch." >> "$GITHUB_STEP_SUMMARY"
