# Trekky for Windows (ADR-0018, ADR-0020, ADR-0024): every PR that touches the desktop app or the web app it bundles
# builds the MSI on Windows and keeps it as an artifact; a tag desktop-v<version> builds it again, signs it for the
# updater and drafts a GitHub release with it and the update feed (latest.json). The MSI is not code-signed yet, so
# Windows SmartScreen warns on a first install.
name: Desktop

on:
  pull_request:
    branches: [dev, staging, main]
    paths: &paths
      - desktop/**
      - frontend/**
      - .github/workflows/desktop.yml
  # Builds on dev too, so later PRs can restore its cargo cache (PR caches are not shared between PRs).
  push:
    branches: [dev]
    paths: *paths
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    name: Windows MSI (lint + test + build)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      # The version from desktop/rust-toolchain.toml, with clippy and rustfmt. It applies to every cargo command run
      # from desktop/ or below (lint, test, build), because rustup looks for the file upwards from the working folder.
      - name: Rust toolchain
        id: rust
        working-directory: desktop
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install
          "version=$(rustc --version)" >> $env:GITHUB_OUTPUT
      # The MSI folder is left out: a version bump would otherwise leave the old MSI next to the new one.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
            !desktop/src-tauri/target/release/bundle
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-

      # The version in tauri.conf.json, Cargo.toml and package.json agree, and a release tag names it.
      - name: Version
        id: version
        working-directory: desktop
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = if ($env:REF_TYPE -eq 'tag') { node scripts/release.mts $env:REF_NAME } else { node scripts/release.mts }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Release scripts (types)
        working-directory: desktop
        run: ../frontend/node_modules/.bin/tsc -p scripts
      - name: Release scripts (tests)
        working-directory: desktop
        run: node --test scripts/release.test.mts scripts/update-manifest.test.mts

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Lint the shell (fmt + clippy)
        working-directory: desktop
        run: npm run lint
      - name: Test the shell
        working-directory: desktop
        run: npm test

      # Builds the web app, the release exe and the MSI. The first-run server is the repository variable
      # TREKKY_DEFAULT_SERVER_URL (the home host's Funnel address) when it is set, else the local dev server.
      # No secrets here: the build runs the whole npm and cargo tree.
      - name: Build the MSI
        working-directory: desktop
        env:
          DEFAULT_SERVER_URL: ${{ vars.TREKKY_DEFAULT_SERVER_URL }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:DEFAULT_SERVER_URL) { $env:TREKKY_DEFAULT_SERVER_URL = $env:DEFAULT_SERVER_URL }
          Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          npm run build
      - name: Find the MSI
        id: msi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "Trekky_$($env:VERSION)_x64_en-US.msi"
          $path = "desktop/src-tauri/target/release/bundle/msi/$name"
          if (-not (Test-Path $path)) { throw "The build did not produce $name" }
          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT
      # Releases only: sign the MSI for the updater with Trekky's key (repository secrets, ADR-0024), bound to this
      # version (<msi>.sig), and write the update feed. The key reaches only this step, and only for a desktop-v tag.
      - name: Sign the MSI for the updater
        if: github.ref_type == 'tag'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          MSI: ${{ steps.msi.outputs.name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'A release needs the updater signing key (secret TAURI_SIGNING_PRIVATE_KEY).' }
          npx tauri signer sign --app-version $env:VERSION "src-tauri/target/release/bundle/msi/$($env:MSI)"
      - name: Write the update feed
        if: github.ref_type == 'tag'
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          MSI: ${{ steps.msi.outputs.name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/update-manifest.mts $env:VERSION $env:TAG "src-tauri/target/release/bundle/msi/$($env:MSI)" src-tauri/target/release/bundle/msi/latest.json
      - uses: actions/upload-artifact@v7
        with:
          name: trekky-desktop-${{ steps.version.outputs.version }}-msi
          # The MSI, and for a release its .sig and latest.json.
          path: |
            ${{ steps.msi.outputs.path }}
            ${{ steps.msi.outputs.path }}.sig
            desktop/src-tauri/target/release/bundle/msi/latest.json
          if-no-files-found: error
          retention-days: 14
    outputs:
      version: ${{ steps.version.outputs.version }}
      msi: ${{ steps.msi.outputs.name }}

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: msi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trekky-desktop-${{ needs.msi.outputs.version }}-msi
          path: msi
      # A draft: Claude installs it over the previous version, checks it and publishes it (RELEASING.md). Publishing
      # makes it the latest release, whose latest.json the installed apps read.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.msi.outputs.version }}
          MSI: ${{ needs.msi.outputs.msi }}
        run: |
          test -s msi/latest.json || { echo "The build has no update feed (latest.json)"; exit 1; }
          gh release create "$TAG" "msi/$MSI" msi/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Trekky for Windows $VERSION" \
            --notes "Trekky for Windows $VERSION (MSI). Installed apps offer this version on their next start. A first install from this page shows a Windows SmartScreen warning, as the installer is not code-signed yet: choose More info, then Run anyway. It upgrades an earlier install in place." \
            --verify-tag
